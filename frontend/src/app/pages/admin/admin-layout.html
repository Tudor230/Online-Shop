<div class="h-screen flex flex-col bg-[--color-bg]">
  <div class="flex flex-1 min-h-0">
    <aside class="flex h-full w-52 shrink-0 flex-col bg-[#f6f9fc] border-r border-[--color-border]">
      <div class="flex items-center gap-2.5 px-4 py-5">
        <span class="inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-sm bg-[--color-brand]">
          <svg viewBox="0 0 24 24" class="h-3.5 w-3.5 fill-white"><path d="M16 6a4 4 0 0 0-8 0H3v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6h-5zM12 4a2 2 0 0 1 2 2h-4a2 2 0 0 1 2-2z"/></svg>
        </span>
        <div class="min-w-0">
          <p class="truncate text-sm font-normal text-[--color-text]">Admin</p>
          <p class="truncate text-[11px] text-[--color-text-muted]">Store management</p>
        </div>
      </div>

      <nav class="flex flex-1 flex-col gap-0.5 overflow-y-auto px-2">
        <div class="mt-2 mb-1.5 px-3">
          <p class="text-[11px] font-semibold uppercase tracking-[0.15em] text-[--color-text-muted]/50">Management</p>
        </div>

        <a routerLink="/admin" routerLinkActive="text-[--color-brand] bg-[--color-brand-muted]" [routerLinkActiveOptions]="{ exact: true }" class="flex items-center gap-2.5 rounded-sm px-3 py-2 text-sm text-[--color-text-muted] transition-all hover:bg-[--color-brand-muted] hover:text-[--color-text]">
          <svg viewBox="0 0 24 24" class="h-4 w-4 shrink-0 fill-current"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
          <span>Dashboard</span>
        </a>
        <a routerLink="/admin/orders" routerLinkActive="text-[--color-brand] bg-[--color-brand-muted]" class="flex items-center gap-2.5 rounded-sm px-3 py-2 text-sm text-[--color-text-muted] transition-all hover:bg-[--color-brand-muted] hover:text-[--color-text]">
          <svg viewBox="0 0 24 24" class="h-4 w-4 shrink-0 fill-current"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
          <span>Orders</span>
        </a>
        <a routerLink="/admin/products" routerLinkActive="text-[--color-brand] bg-[--color-brand-muted]" class="flex items-center gap-2.5 rounded-sm px-3 py-2 text-sm text-[--color-text-muted] transition-all hover:bg-[--color-brand-muted] hover:text-[--color-text]">
          <svg viewBox="0 0 24 24" class="h-4 w-4 shrink-0 fill-current"><path d="M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 4H6v-4h6v4z"/></svg>
          <span>Products</span>
        </a>
        <a routerLink="/admin/users" routerLinkActive="text-[--color-brand] bg-[--color-brand-muted]" class="flex items-center gap-2.5 rounded-sm px-3 py-2 text-sm text-[--color-text-muted] transition-all hover:bg-[--color-brand-muted] hover:text-[--color-text]">
          <svg viewBox="0 0 24 24" class="h-4 w-4 shrink-0 fill-current"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
          <span>Users</span>
        </a>
        <a routerLink="/admin/categories" routerLinkActive="text-[--color-brand] bg-[--color-brand-muted]" class="flex items-center gap-2.5 rounded-sm px-3 py-2 text-sm text-[--color-text-muted] transition-all hover:bg-[--color-brand-muted] hover:text-[--color-text]">
          <svg viewBox="0 0 24 24" class="h-4 w-4 shrink-0 fill-current"><path d="M12 2l-5.5 9h11z"/><circle cx="17.5" cy="17.5" r="4.5"/><path d="M3 13.5h8v8H3z"/></svg>
          <span>Categories</span>
        </a>

        <div class="mt-4 mb-1.5 px-3">
          <p class="text-[11px] font-semibold uppercase tracking-[0.15em] text-[--color-text-muted]/50">System</p>
        </div>

        <a routerLink="/admin/audit-logs" routerLinkActive="text-[--color-brand] bg-[--color-brand-muted]" class="flex items-center gap-2.5 rounded-sm px-3 py-2 text-sm text-[--color-text-muted] transition-all hover:bg-[--color-brand-muted] hover:text-[--color-text]">
          <svg viewBox="0 0 24 24" class="h-4 w-4 shrink-0 fill-current"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
          <span>Audit Logs</span>
        </a>
      </nav>

      <div class="px-2 pb-3">
        <a routerLink="/products" class="flex items-center justify-center gap-1.5 rounded-sm px-3 py-2 text-[10px] font-normal text-[--color-text-muted] transition-colors hover:bg-[--color-brand-muted] hover:text-[--color-text]">
          <svg viewBox="0 0 24 24" class="h-3 w-3 fill-current"><path d="M10 6 4 12l6 6 1.4-1.4L7.8 13H20v-2H7.8l3.6-3.6z"/></svg>
          Storefront
        </a>
      </div>
    </aside>

    <main class="flex-1 min-h-0 overflow-y-auto p-6 bg-white">
      <router-outlet />
    </main>
  </div>
</div>
