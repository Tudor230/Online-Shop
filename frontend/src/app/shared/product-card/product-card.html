<article
  class="card card-interactive group relative grid h-full cursor-pointer gap-4 overflow-hidden p-4 transition-all duration-200 hover:-translate-y-1 hover:shadow-[rgba(50,50,93,0.25)_0px_30px_60px_-30px,rgba(0,0,0,0.15)_0px_18px_36px_-18px]"
  role="button"
  tabindex="0"
  (click)="onSelected()"
  (keydown.enter)="onSelected()"
  (keydown.space)="onSelected()"
>
  <div class="relative">
    <div class="aspect-[1/1] overflow-hidden rounded-sm bg-[#f6f9fc]">
      <app-cloudinary-image-frame
        [source]="product.imageId" [alt]="product.title" [options]="productImageOptions"
        width="560" height="560"
        imageClass="h-full w-full object-cover transition-transform duration-500 ease-out group-hover:scale-105"
        fallbackClass="grid h-full w-full place-items-center text-sm font-normal text-[--color-text-muted]"
        fallbackText="Image unavailable"
      />
    </div>

    <button
      type="button"
      [attr.aria-label]="isWishlisted ? 'Remove from wishlist' : 'Save to wishlist'"
      [attr.aria-pressed]="isWishlisted"
      class="absolute right-3 top-3 z-10 grid h-9 w-9 cursor-pointer place-items-center rounded-sm bg-white/80 text-base backdrop-blur-sm shadow-sm transition-all duration-150 hover:bg-white"
      [ngClass]="isWishlisted ? 'text-[--color-danger]' : 'text-[--color-text-muted] hover:text-[--color-text]'"
      (click)="onSaveToWishlist($event)"
    >{{ isWishlisted ? '♥' : '♡' }}</button>

    @if (product.reviewCount > 50) {
      <span class="absolute left-3 top-3 rounded-sm bg-[--color-brand] px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wider text-white shadow-sm">Popular</span>
    }
  </div>

  <div class="grid gap-2">
    <p class="text-[10px] font-semibold uppercase tracking-[0.15em] text-[--color-brand]">{{ product.category }}</p>
    <h3 class="text-sm font-normal leading-snug text-[--color-text] group-hover:text-[--color-brand] transition-colors duration-150 line-clamp-2">{{ product.title }}</h3>
    <div class="flex items-center gap-1.5">
      <span class="text-xs font-normal text-[--color-text]">★ {{ product.rating | number : '1.1-1' }}</span>
      <span class="text-[10px] text-[--color-text-muted]">({{ product.reviewCount }})</span>
    </div>
  </div>

  <div class="mt-auto flex items-end justify-between gap-3">
    <div class="flex flex-col">
      <p class="text-lg font-normal tracking-tight text-[--color-text] leading-none">{{ product.price | currency : 'RON' : 'symbol' : '1.2-2' }}</p>
    </div>
    <button type="button" aria-label="Add to cart" class="btn-primary h-9 px-4 text-xs font-normal whitespace-nowrap transition-all duration-150 group-hover:bg-[--color-brand-hover]" (click)="onAddToCart($event)">Add to cart</button>
  </div>
</article>
