<article
  class="card card-interactive group relative grid h-full cursor-pointer gap-4 p-4"
  role="button"
  tabindex="0"
  (click)="onSelected()"
  (keydown.enter)="onSelected()"
  (keydown.space)="onSelected()"
>
  <button
    type="button"
    [attr.aria-label]="isWishlisted ? 'Remove from wishlist' : 'Save to wishlist'"
    [attr.aria-pressed]="isWishlisted"
    class="absolute right-4 top-4 z-10 grid h-9 w-9 cursor-pointer place-items-center rounded-full bg-[--color-bg]/70 text-sm backdrop-blur-sm transition-colors duration-120"
    [ngClass]="isWishlisted ? 'text-[--color-danger]' : 'text-text-muted hover:text-text-primary'"
    (click)="onSaveToWishlist($event)"
  >{{ isWishlisted ? '♥' : '♡' }}</button>

  <div class="aspect-[4/3] overflow-hidden rounded-xl bg-[--color-bg]/50">
    <app-cloudinary-image-frame
      [source]="product.imageId" [alt]="product.title" [options]="productImageOptions"
      width="560" height="420"
      imageClass="h-full w-full object-contain"
      fallbackClass="grid h-full w-full place-items-center text-sm font-medium text-text-muted"
      fallbackText="Image unavailable"
    />
  </div>

  <div class="grid gap-1.5">
    <p class="text-[10px] font-semibold uppercase tracking-[0.15em] text-[--color-brand]">{{ product.category }}</p>
    <h3 class="text-sm font-semibold leading-snug text-text-primary">{{ product.title }}</h3>
    <p class="text-xs text-text-muted">★ {{ product.rating | number : '1.1-1' }} ({{ product.reviewCount }})</p>
  </div>

  <div class="mt-auto flex items-center justify-between gap-3">
    <p class="text-base font-bold tracking-tight text-text-primary">{{ product.price | currency : 'RON' : 'symbol' : '1.2-2' }}</p>
    <button type="button" aria-label="Add to cart" class="btn-primary h-9 w-9 text-sm" (click)="onAddToCart($event)">+</button>
  </div>
</article>
