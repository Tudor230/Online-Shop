<header class="fixed top-0 left-0 right-0 z-50 bg-transparent transition-transform duration-500 ease-premium"
  [class.-translate-y-full]="isHidden()" [class.translate-y-0]="!isHidden()">
  <div class="mx-auto flex w-full max-w-7xl items-center justify-between px-4 py-4 md:px-6 lg:px-8">
    <a href="/" class="text-base font-semibold tracking-tight text-white">Online Shop</a>
    @if (authState.isAuthenticated()) {
      <div class="inline-flex items-center gap-2 rounded-sm bg-white px-3 py-2 text-sm text-[--color-text]">
        <span class="inline-flex h-6 w-6 items-center justify-center rounded-full bg-[--color-border]" aria-hidden="true"><svg viewBox="0 0 24 24" class="h-3.5 w-3.5 fill-current"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"/></svg></span>
        <span>{{ authState.displayName() }}</span>
      </div>
    } @else {
      <button type="button" class="btn-primary px-4 py-2 text-sm" (click)="login()">Sign in</button>
    }
  </div>
</header>
