@if (isOpen) {
  <div class="fixed inset-0 z-50 animate-slide-in-right">
    <button type="button" class="absolute inset-0 bg-black/50 backdrop-blur-sm" aria-label="Close cart" (click)="onCloseRequested()"></button>
    <aside class="absolute right-0 top-0 h-full w-full max-w-md border-l border-border bg-[--color-surface]">
      <div class="flex h-full flex-col">
        <div class="flex items-center justify-between border-b border-border px-6 py-4">
          <h2 class="text-lg font-semibold text-text-primary">Shopping cart</h2>
          <button type="button" class="btn-ghost px-3 py-1.5 text-xs" (click)="onCloseRequested()">Close</button>
        </div>

        @if (!items.length) {
          <div class="flex flex-1 items-center justify-center px-6">
            <div class="text-center">
              <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-[--color-border]/50 text-text-muted/40">
                <svg viewBox="0 0 24 24" class="h-5 w-5 fill-current"><path d="M7 18a2 2 0 1 0 2 2 2 2 0 0 0-2-2Zm10 0a2 2 0 1 0 2 2 2 2 0 0 0-2-2ZM7.2 14h10.7a2 2 0 0 0 2-1.6L22 5H6.2l-.3-2H2v2h2.3l1.6 10.4A2 2 0 0 0 7.2 17H20v-2H7.2Z"/></svg>
              </div>
              <p class="text-sm text-text-muted">Your cart is empty</p>
            </div>
          </div>
        } @else {
          <div class="flex-1 overflow-y-auto px-6 py-3">
            <div class="grid gap-0 divide-y divide-border">
              @for (item of items; track item.productId) {
                <article class="group cursor-pointer py-4" role="button" tabindex="0"
                  (click)="onItemSelected(item.productSlug)"
                  (keydown.enter)="onItemSelected(item.productSlug)"
                  (keydown.space)="onItemSelected(item.productSlug); $event.preventDefault()">
                  <div class="grid grid-cols-[88px_minmax(0,1fr)_auto] items-start gap-3">
                    <div class="w-20 overflow-hidden rounded-xl bg-[--color-bg]/50 aspect-[4/3]">
                      <app-cloudinary-image-frame [source]="item.imageId" [alt]="item.title" [options]="cartImageOptions" width="160" height="160" [useLazy]="true"
                        imageClass="h-full w-full object-contain"
                        fallbackClass="grid h-full w-full place-items-center px-1 text-center text-[11px] font-medium text-text-muted"
                        fallbackText="Image unavailable"/>
                    </div>
                    <div class="min-w-0">
                      <p class="truncate text-sm font-semibold text-text-primary">{{ item.title }}</p>
                      <div class="mt-3 inline-flex items-center gap-1.5 rounded-full bg-[--color-bg]/60 p-0.5">
                        <button type="button" class="btn-ghost h-7 w-7 text-sm" aria-label="Decrease quantity"
                          (click)="$event.stopPropagation(); onDecrementRequested(item.productId)">-</button>
                        <span class="min-w-5 text-center text-xs font-semibold text-text-primary">{{ item.quantity }}</span>
                        <button type="button" class="btn-ghost h-7 w-7 text-sm" aria-label="Increase quantity"
                          (click)="$event.stopPropagation(); onIncrementRequested(item.productId)">+</button>
                      </div>
                    </div>
                    <div class="text-right">
                      <p class="text-sm font-bold text-text-primary">{{ item.price | currency : 'RON' : 'symbol' : '1.2-2' }}</p>
                      <button type="button" class="btn-ghost mt-2 px-0 text-[11px] text-text-muted/50 hover:text-[--color-danger]"
                        (click)="$event.stopPropagation(); onRemoveRequested(item.productId)">Remove</button>
                    </div>
                  </div>
                </article>
              }
            </div>
          </div>
        }

        <div class="border-t border-border px-6 py-5">
          <div class="flex items-center justify-between text-base font-bold text-text-primary">
            <span>Total</span><span>{{ totalPrice | currency : 'RON' : 'symbol' : '1.2-2' }}</span>
          </div>
          <button type="button" class="btn-primary mt-4 w-full py-3 text-sm font-semibold"
            [disabled]="!items.length || isCheckoutInProgress" (click)="onCheckoutRequested()">
            {{ isCheckoutInProgress ? 'Redirecting...' : 'Checkout' }}
          </button>
        </div>
      </div>
    </aside>
  </div>
}
